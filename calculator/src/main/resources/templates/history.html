<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculation History</title>

    <link rel="stylesheet"
          th:href="@{/css/history.css}">

</head>

<body>

<div class="history-container">

    <!-- Header -->

    <div class="history-header">

        <h1>Calculation History</h1>

        <!--        <a href="/calculator"-->
        <!--           class="back-button">-->
        <!--            Back to Calculator-->
        <!--        </a>-->

        <!--        BOTH WILL DO THE SAME WORK BUT HERE WE ARE USING THYMELEAF-->

        <a th:href="@{/calculator}"
           class="back-button">
            Back to Calculator
        </a>

        <form th:action="@{/history/clear}"
              method="post"
              style="display: inline;">

            <button type="submit"
                    class="clear-button"
                    onclick="return confirm('Are you sure you want to clear all calculation history?');">
                Clear History
            </button>

        </form>


    </div>


    <!-- History Table -->

    <table class="history-table"
           th:if="${calculations != null and !calculations.isEmpty()}">

        <thead>

        <tr>

            <th>ID</th>

            <th>First Number</th>

            <th>Operator</th>

            <th>Second Number</th>

            <th>Result</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="calculation : ${calculations}">

            <td th:text="${calculation.id}">
                1
            </td>

            <td th:text="${calculation.firstNumber}">
                10
            </td>

            <td class="operator"
                th:text="${calculation.operator}">
                +
            </td>

            <td th:text="${calculation.secondNumber}">
                20
            </td>

            <td class="result"
                th:text="${calculation.result}">
                30
            </td>

            <td>

                <!-- Edit -->

                <a th:href="@{/history/edit/{id}(id=${calculation.id})}"
                   class="edit-button">

                    Edit

                </a>

                <!-- Delete   -->

                <form th:action="@{/history/delete/{id}(id=${calculation.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit"
                            class="delete-button"
                            onclick="return confirm('Are you sure you want to delete this calculation?');">

                        Delete

                    </button>

                </form>

            </td>



        </tr>

        </tbody>

    </table>


    <!-- Empty History -->

    <div class="empty-message"
         th:if="${calculations == null or calculations.isEmpty()}">

        <p>No calculations found.</p>

        <p>Start using the calculator to build your history.</p>

    </div>

</div>

</body>

</html>
