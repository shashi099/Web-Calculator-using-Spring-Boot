<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Calculation</title>

    <link rel="stylesheet"
          th:href="@{/css/calculator.css}">

</head>

<body>

<div class="calculator-container">

    <h1>✏️ Edit Calculation</h1>

    <form th:action="@{/history/edit/{id}(id=${calculation.id})}"
          method="post">

        <!-- First Number -->

        <div class="form-group">

            <label for="firstNumber">
                First Number
            </label>

            <input
                    type="number"
                    id="firstNumber"
                    name="firstNumber"
                    step="any"
                    th:value="${calculation.firstNumber}"
                    required
            >

        </div>


        <!-- Operator -->

        <div class="form-group">

            <label for="operator">
                Operation
            </label>

            <select id="operator"
                    name="operator">

                <option value="+"
                        th:selected="${calculation.operator == '+'}">
                    Addition (+)
                </option>

                <option value="-"
                        th:selected="${calculation.operator == '-'}">
                    Subtraction (-)
                </option>

                <option value="*"
                        th:selected="${calculation.operator == '*'}">
                    Multiplication (*)
                </option>

                <option value="/"
                        th:selected="${calculation.operator == '/'}">
                    Division (/)
                </option>

                <option value="%"
                        th:selected="${calculation.operator == '%'}">
                    Modulus (%)
                </option>

            </select>

        </div>


        <!-- Second Number -->

        <div class="form-group">

            <label for="secondNumber">
                Second Number
            </label>

            <input
                    type="number"
                    id="secondNumber"
                    name="secondNumber"
                    step="any"
                    th:value="${calculation.secondNumber}"
                    required
            >

        </div>


        <!-- Update Button -->

        <button
                type="submit"
                class="calculate-button">

            Update Calculation

        </button>

    </form>


    <!-- Back Button -->

    <div class="history-container">

        <a th:href="@{/history}"
           class="history-button">

            Back to History

        </a>

    </div>

</div>

</body>

</html>
